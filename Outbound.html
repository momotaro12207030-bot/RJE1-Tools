<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outbound 計算ツール</title>
<link rel="icon" type="image/png" href="favicon-rje1.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --surface2: #21262d;
    --border: #30363d;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --green: #3fb950;
    --yellow: #d29922;
    --red: #f85149;
    --green-bg: rgba(63,185,80,0.12);
    --yellow-bg: rgba(210,153,34,0.12);
    --red-bg: rgba(248,81,73,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    margin: 0;
  }

  .container {
    max-width: 760px;
    margin: 0 auto;
  }


  .appShell {
    display: flex;
    min-height: 100vh;
  }

  .navSidebar {
    width: 220px;
    border-right: 1px solid var(--border);
    padding: 16px 12px;
    position: sticky;
    top: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: var(--surface);
  }

  .navTitle {
    margin: 0 0 6px;
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: .08em;
  }

  .navBtn,
  .navLink {
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 12px;
    text-align: left;
    font-weight: 700;
    cursor: pointer;
    text-decoration: none;
    font-size: 14px;
    display: block;
  }

  .navBtn.active {
    border-color: var(--accent);
    color: var(--accent);
  }

  .navLink {
    margin-top: auto;
    color: var(--text-muted);
  }

  .mainView {
    flex: 1;
    padding: 2rem 1rem;
  }

  header {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    margin-bottom: 2rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 1rem;
  }

  header h1 {
    font-family: 'DM Mono', monospace;
    font-size: 1.3rem;
    color: var(--accent);
    letter-spacing: 0.05em;
  }

  header span {
    font-size: 0.75rem;
    color: var(--text-muted);
  }

  /* Risk badge */
  .risk-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1.2rem;
    border-radius: 999px;
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    margin-bottom: 1.5rem;
    transition: all 0.3s ease;
  }
  .risk-badge.safe { background: var(--green-bg); color: var(--green); border: 1px solid var(--green); }
  .risk-badge.low  { background: var(--yellow-bg); color: var(--yellow); border: 1px solid var(--yellow); }
  .risk-badge.high { background: var(--red-bg); color: var(--red); border: 1px solid var(--red); }

  .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

  /* Grid layout */
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1rem;
  }

  .grid-3 {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 1rem;
    margin-bottom: 1rem;
  }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 1rem 1.2rem;
  }

  .card-label {
    font-size: 0.7rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 0.4rem;
  }

  .card-value {
    font-family: 'DM Mono', monospace;
    font-size: 1.8rem;
    font-weight: 500;
    color: var(--text);
    line-height: 1;
  }

  .card-value.accent { color: var(--accent); }
  .card-value.green { color: var(--green); }

  input[type="number"] {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 1.8rem;
    font-weight: 500;
    width: 100%;
    padding: 0;
    outline: none;
    transition: border-color 0.2s;
    line-height: 1;
  }

  input[type="number"]:focus { border-color: var(--accent); }
  input[type="number"]::-webkit-inner-spin-button { display: none; }

  /* Section header */
  .section-title {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--text-muted);
    margin: 1.5rem 0 0.75rem;
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .section-title::after { content:''; flex:1; height:1px; background: var(--border); }

  /* Staff table */
  .staff-table {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }

  .staff-row {
    display: grid;
    grid-template-columns: 1fr 120px 120px 36px;
    align-items: center;
    gap: 0.75rem;
    padding: 0.6rem 1rem;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  .staff-row:last-child { border-bottom: none; }
  .staff-row:hover { background: var(--surface2); }
  .staff-row.header {
    background: var(--surface2);
    font-size: 0.65rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 0.5rem 1rem;
  }

  .staff-name {
    font-size: 0.9rem;
  }

  .staff-input {
    font-family: 'DM Mono', monospace;
    font-size: 0.95rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    padding: 0.25rem 0.5rem;
    width: 100%;
    outline: none;
    transition: border-color 0.2s;
    text-align: center;
  }
  .staff-input:focus { border-color: var(--accent); }
  .staff-input::-webkit-inner-spin-button { display: none; }
  .staff-input.name { text-align: left; }
  .staff-input::placeholder { font-size: 0.5rem; }

  .delete-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.8rem;
    padding: 0.2rem 0.4rem;
    transition: all 0.15s;
    line-height: 1;
  }
  .delete-btn:hover { border-color: var(--red); color: var(--red); background: var(--red-bg); }

  .add-btn {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    background: none;
    border: 1px dashed var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    cursor: pointer;
    font-size: 0.8rem;
    font-family: 'Noto Sans JP', sans-serif;
    padding: 0.5rem 1rem;
    margin-top: 0.5rem;
    width: 100%;
    transition: all 0.15s;
  }
  .add-btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(88,166,255,0.05); }

  .surplus-bar-wrap {
    height: 6px;
    background: var(--surface2);
    border-radius: 99px;
    margin-top: 0.5rem;
    overflow: hidden;
  }
  .surplus-bar {
    height: 100%;
    border-radius: 99px;
    transition: width 0.4s ease, background 0.3s;
    max-width: 100%;
  }


  @media (max-width: 980px) {
    .appShell {
      flex-direction: column;
    }

    .navSidebar {
      width: 100%;
      height: auto;
      position: static;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      border-right: none;
      border-bottom: 1px solid var(--border);
    }

    .navTitle {
      width: 100%;
    }

    .navLink {
      margin-top: 0;
    }

    .mainView {
      padding-top: 1rem;
    }
  }
</style>
</head>
<body>
<div class="appShell">
  <aside class="navSidebar">
    <p class="navTitle">アプリ切り替え</p>
    <a class="navBtn" href="Inbound.html">作業時間・HC計算</a>
    <a class="navBtn active" href="Outbound.html">Outbound計算</a>
    <a class="navBtn" href="Inbound.html">QR・バーコード作成</a>
    <a class="navLink" href="https://github.com/momotaro12207030-bot/RJE1-Tools#readme" target="_blank" rel="noopener">使い方</a>
  </aside>

  <section class="mainView">
<div class="container">
  <header>
    <h1>OUTBOUND CALC</h1>
    <span>リアルタイム処理能力計算ツール</span>
  </header>

  <div id="riskBadge" class="risk-badge safe">
    <span class="dot"></span>
    <span id="riskText">リスクなし</span>
  </div>

  <div class="section-title">入力項目</div>
  <div class="grid-3">
    <div class="card">
      <div class="card-label">残りケース数</div>
      <input type="number" id="remainCases" value="1000" oninput="calc()">
    </div>
    <div class="card">
      <div class="card-label">残りLH</div>
      <input type="number" id="remainLH" value="22.0" step="0.1" oninput="calc()">
    </div>
    <div class="card">
      <div class="card-label">概算CPH</div>
      <input type="number" id="defaultCPH" value="50" oninput="calc()">
    </div>
  </div>

  <div class="section-title">計算結果</div>
  <div class="grid-3">
    <div class="card">
      <div class="card-label">投入HC</div>
      <div class="card-value accent" id="hcDisplay">0</div>
    </div>
    <div class="card">
      <div class="card-label">平均CPH</div>
      <div class="card-value" id="avgCPH">0</div>
    </div>
    <div class="card">
      <div class="card-label">概算処理能力</div>
      <div class="card-value" id="totalCap">0</div>
    </div>
  </div>
  <div class="grid-3">
    <div class="card">
      <div class="card-label">余力（ケース）</div>
      <div class="card-value green" id="surplus">0</div>
      <div class="surplus-bar-wrap">
        <div class="surplus-bar" id="surplusBar" style="width:0%;background:var(--green)"></div>
      </div>
    </div>
    <div class="card">
      <div class="card-label">達成見込み</div>
      <div class="card-value" id="progressPct">0%</div>
    </div>
    <div class="card">
      <div class="card-label">不足LH（概算CPH基準）</div>
      <div class="card-value" id="shortageLH" style="color:var(--text-muted)">—</div>
      <div style="font-size:0.65rem;color:var(--text-muted);margin-top:0.3rem" id="shortageLHNote"></div>
    </div>
  </div>

  <div class="section-title">個人別生産性</div>
  <div class="staff-table">
    <div class="staff-row header">
      <div>名前</div>
      <div style="text-align:center">CPH</div>
      <div style="text-align:center">処理ケース</div>
      <div></div>
    </div>
    <div id="staffBody"></div>
  </div>
  <button class="add-btn" onclick="addStaff()">＋ スタッフ追加</button>
</div>
  </section>
</div>

<script>
let staff = [
  { name: 'Aさん', cph: 52 },
  { name: 'Bさん', cph: 40 },
  { name: 'Cさん', cph: 51 },
];

function renderStaff() {
  const body = document.getElementById('staffBody');
  body.innerHTML = '';
  staff.forEach((s, i) => {
    const lh = parseFloat(document.getElementById('remainLH').value) || 0;
    const defCPH = parseFloat(document.getElementById('defaultCPH').value) || 0;
    const cphVal = s.cph !== '' && s.cph !== null ? s.cph : defCPH;
    const cases = (cphVal * lh).toFixed(0);

    const row = document.createElement('div');
    row.className = 'staff-row';
    row.innerHTML = `
      <input class="staff-input name" type="text" value="${s.name}" onchange="updateName(${i},this.value)">
      <input class="staff-input" type="number" placeholder="概算使用" value="${s.cph !== null && s.cph !== '' ? s.cph : ''}" oninput="updateCPH(${i},this.value)">
      <div style="text-align:center;font-family:'DM Mono',monospace;font-size:0.9rem;color:var(--text-muted)">${cases}</div>
      <button class="delete-btn" onclick="deleteStaff(${i})">✕</button>
    `;
    body.appendChild(row);
  });
  calc();
}

function updateName(i, v) { staff[i].name = v; }
function updateCPH(i, v) {
  staff[i].cph = v === '' ? null : parseFloat(v);
  calc();
}
function deleteStaff(i) { staff.splice(i, 1); renderStaff(); }
function addStaff() { staff.push({ name: '新スタッフ', cph: null }); renderStaff(); }

function calc() {
  const remainCases = parseFloat(document.getElementById('remainCases').value) || 0;
  const remainLH = parseFloat(document.getElementById('remainLH').value) || 0;
  const defCPH = parseFloat(document.getElementById('defaultCPH').value) || 0;

  const hc = staff.length;
  document.getElementById('hcDisplay').textContent = hc;

  let totalCPH = 0;
  staff.forEach(s => {
    totalCPH += (s.cph !== null && s.cph !== '') ? s.cph : defCPH;
  });

  const avgCPHNum = hc > 0 ? totalCPH / hc : 0;
  const avgCPH = avgCPHNum.toFixed(1);
  // 概算処理能力 = 残りLH × 平均CPH × HC
  const totalCap = (remainLH * avgCPHNum).toFixed(0);
  const surplus = (totalCap - remainCases).toFixed(0);
  const progress = remainCases > 0 ? Math.min(100, (totalCap / remainCases * 100)).toFixed(1) : 0;

  document.getElementById('avgCPH').textContent = avgCPH;
  document.getElementById('totalCap').textContent = Number(totalCap).toLocaleString();
  document.getElementById('surplus').textContent = Number(surplus).toLocaleString();
  document.getElementById('progressPct').textContent = progress + '%';

  // Shortage LH
  const shortageLHEl = document.getElementById('shortageLH');
  const shortageLHNote = document.getElementById('shortageLHNote');
  const surplusNum = parseFloat(surplus);
  if (surplusNum < 0 && defCPH > 0) {
    // 不足LH = 不足ケース数 / 概算CPH
    const shortageLH = (Math.abs(surplusNum) / defCPH).toFixed(2);
    // 残業換算LH = 不足ケース数 / (平均CPH × HC) = 不足ケース / 総CPH
    const overtimeLH = avgCPHNum > 0 ? (Math.abs(surplusNum) / avgCPHNum).toFixed(2) : '—';
    shortageLHEl.textContent = shortageLH + ' h';
    shortageLHEl.style.color = 'var(--red)';
    shortageLHNote.textContent = `残業換算で約 ${overtimeLH} h（平均CPH基準）`;
  } else {
    shortageLHEl.textContent = '—';
    shortageLHEl.style.color = 'var(--text-muted)';
    shortageLHNote.textContent = '余力あり';
  }

  // Risk
  const badge = document.getElementById('riskBadge');
  const riskText = document.getElementById('riskText');
  badge.className = 'risk-badge';
  if (surplusNum >= 30) {
    badge.classList.add('safe'); riskText.textContent = 'リスクなし';
  } else if (surplusNum >= 0) {
    badge.classList.add('low'); riskText.textContent = '低リスク';
  } else {
    badge.classList.add('high'); riskText.textContent = '要注意';
  }

  // Surplus bar
  const bar = document.getElementById('surplusBar');
  const barPct = remainCases > 0 ? Math.max(0, Math.min(100, surplusNum / remainCases * 100 + 50)) : 50;
  bar.style.width = barPct + '%';
  bar.style.background = surplusNum >= 30 ? 'var(--green)' : surplusNum >= 0 ? 'var(--yellow)' : 'var(--red)';

  // Re-render staff cases
  const rows = document.querySelectorAll('#staffBody .staff-row');
  rows.forEach((row, i) => {
    const cphVal = (staff[i].cph !== null && staff[i].cph !== '') ? staff[i].cph : defCPH;
    const cases = (cphVal * remainLH).toFixed(0);
    const caseEl = row.children[2];
    if (caseEl) caseEl.textContent = cases;
  });
}

renderStaff();
</script>
</body>
</html>
